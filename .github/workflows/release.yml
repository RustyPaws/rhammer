name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-amd64,   os: windows-latest,   ext: .exe, archive: zip }
          - { name: windows-aarch64, os: windows-11-arm,   ext: .exe, archive: zip }
          - { name: macos-aarch64,   os: macos-latest,     ext: '',   archive: tar.gz }
          - { name: linux-amd64,     os: ubuntu-latest,    ext: '',   archive: tar.gz }
          - { name: linux-aarch64,   os: ubuntu-24.04-arm, ext: '',   archive: tar.gz }
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev libx11-dev libxcb1-dev libgl1-mesa-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
      - run: cargo build --release --locked
      - name: Package
        shell: bash
        run: |
          name="rhammer-${{ github.ref_name }}-${{ matrix.name }}"
          mkdir "$name"
          cp "target/release/rhammer${{ matrix.ext }}" "$name/"
          if [ "${{ matrix.archive }}" = zip ]; then
            7z a "$name.zip" "$name"
          else
            tar czf "$name.tar.gz" "$name"
          fi
          echo "ASSET=$name.${{ matrix.archive }}" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ env.ASSET }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
